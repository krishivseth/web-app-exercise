{% extends "base.html" %}
{% block title %}Post a session - StudyBuddy{% endblock %}
{% block content %}
<h1>Post a study session</h1>

{% if not people %}
<p class="empty">You need a profile first. <a href="{{ url_for('new_profile') }}">Create one.</a></p>
{% else %}
<form method="post" class="form">
  <label>Course
    <input name="course" placeholder="CSCI-UA 310" required>
  </label>
  <label>Topic
    <input name="topic" placeholder="Problem set 5, dynamic programming" required>
  </label>
  <label>Description (optional)
    <textarea name="description" placeholder="What will you be studying?"></textarea>
  </label>
  <label>Maximum Participants
    <input type="number" name="max_participants" min="2" max="20" value="5" required>
  </label>
  <label>When
    <input name="time" placeholder="Tue 7pm" required>
  </label>
  <label>Where
    <input name="location" placeholder="Bobst 5th floor" required>
  </label>
  <label>Posting as
    <select name="organizer_id" required>
      {% for p in people %}
      <option value="{{ p._id }}">{{ p.name }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Post</button>
</form>
{% endif %}
{% endblock %}
