{% extends "base.html" %}

{% block title %}Delete session - StudyBuddy{% endblock %}

{% block content %}
<h1>Delete this session?</h1>

<div class="delete-confirmation">
  <p><strong>Topic:</strong> {{ item.topic }}</p>
  <p><strong>When:</strong> {{ item.time }}</p>
  <p><strong>Where:</strong> {{ item.location }}</p>

  <p class="delete-warning">
    This action cannot be undone.
  </p>

  <form method="post">
    {{ form.hidden_tag() }}
    <button type="submit" class="delete-button">
      Yes, Delete Session
    </button>
  </form>

  <a href="{{ url_for('request_detail', request_id=item._id) }}"
     class="cancel-button">
    Cancel
  </a>
</div>
{% endblock %}
