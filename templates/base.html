<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyBuddy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}">StudyBuddy</a>
  </header>

  <main class="page">
    <nav aria-label="Account">
    {% if current_user.is_authenticated %}
        <a href="{{ url_for('profile_detail', profile_id=current_user.id) }}">
        My profile
        </a>
        ·
        <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        ·
        <a href="{{ url_for('signup') }}">Create account</a>
    {% endif %}
    </nav>
    {% block content %}{% endblock %}
  </main>

  <nav class="tabs">
    <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Sessions</a>
    <a href="{{ url_for('new_request') }}" class="{{ 'active' if request.endpoint == 'new_request' }}">Create session</a>
    <a href="{{ url_for('profile_list') }}" class="{{ 'active' if request.endpoint in ['profile_list', 'profile_detail', 'new_profile'] }}">Students</a>
  </nav>
</body>
</html>
